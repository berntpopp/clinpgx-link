[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clinpgx-link"
version = "0.1.0"
description = "A research-only MCP server for public ClinPGx data and source evidence."
authors = [{ name = "Bernt Popp" }]
license = { text = "MIT" }
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "asgi-correlation-id>=5.0.1,<6.0.0",
    "async-lru>=2.0.4,<3.0.0",
    "fastapi>=0.140.0,<1.0.0",
    "fastmcp>=3.4.5,<4.0.0",
    "httpx>=0.28.0,<1.0.0",
    "ijson>=3.4,<4",
    "jsonschema>=4.26,<5",
    "mcp[cli]>=1.28.1,<2.0.0",
    "openpyxl>=3.1,<4",
    "orjson>=3.10.0,<4.0.0",
    "pydantic>=2.11.0,<3.0.0",
    "pydantic-settings>=2.15.0,<3.0.0",
    "rich>=15.0.0,<16.0.0",
    "structlog>=26.1.0,<27.0.0",
    "typer>=0.27.1,<1.0.0",
    "uvicorn[standard]>=0.52.1,<1.0.0",
    "zstandard>=0.23.0,<1.0.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0,<3.0.0",
    "pre-commit>=4.6.1,<5.0.0",
    "pytest>=9.1.1,<10.0.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "pytest-cov>=6.0.0,<8.0.0",
    "pytest-mock>=3.14.0,<4.0.0",
    "pytest-xdist>=3.6.0,<4.0.0",
    "respx>=0.22.0,<1.0.0",
    "ruff>=0.16.1,<1.0.0",
    "types-jsonschema>=4.26.0.20260518",
]

[project.scripts]
clinpgx-link = "clinpgx_link.cli:app"

[project.urls]
Homepage = "https://github.com/berntpopp/clinpgx-link"
Repository = "https://github.com/berntpopp/clinpgx-link"
Issues = "https://github.com/berntpopp/clinpgx-link/issues"

[tool.hatch.build.targets.wheel]
packages = ["clinpgx_link"]

[tool.ruff]
line-length = 100
target-version = "py312"
force-exclude = true
exclude = [
    "tests/conformance/__init__.py",
    "tests/conformance/behaviour.py",
    "tests/conformance/conformance.py",
    "tests/conformance/test_behaviour_v1.py",
    "tests/conformance/test_transport_v1.py",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "S", "T20", "SIM", "RUF"]
ignore = ["S101", "E501", "B008", "RUF012", "SIM108", "SIM117"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["S101", "S105", "S106", "T20"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
files = ["clinpgx_link"]

[[tool.mypy.overrides]]
module = ["structlog.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["--strict-markers", "-ra", "--import-mode=importlib"]
markers = [
    "integration: live/source integration tests excluded from the ordinary unit path",
    "slow: slow tests excluded from the fast path",
]

[tool.coverage.run]
source = ["clinpgx_link"]
branch = true
omit = ["tests/*", "*/tests/*", "*/__init__.py"]

[tool.coverage.report]
fail_under = 80
precision = 2
show_missing = true
skip_empty = true
