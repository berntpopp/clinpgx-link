name: mcp-conformance
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CONFORMANCE_NAME: clinpgx-link       # serverInfo.name
      CONFORMANCE_TIER: stateless
      MCP_PORT: "8099"                    # docker-compose host port (fixed; see CLINPGX_LINK_HOST_PORT)
      CLINPGX_LINK_HOST_PORT: "8099"      # pins the compose host port for CI
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv sync --group dev
      - name: Build & start server
        run: make docker-build && make docker-up
      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            curl -fsS "http://127.0.0.1:${MCP_PORT}/health" && break || sleep 2
          done
      - name: Run conformance probe
        env:
          CONFORMANCE_MCP_URL: http://127.0.0.1:${{ env.MCP_PORT }}
        run: uv run pytest tests/conformance/test_transport_v1.py -v
      - name: Run behaviour probe
        # Behaviour Conformance v1 -- the three recurring contract bugs (silent-empty
        # filter, lying total/truncated, error an LLM cannot act on) plus isError and
        # the closed error_code enum. Every probe is derived from this server's own
        # advertised schema; there is no per-repo probe list to maintain.
        env:
          CONFORMANCE_MCP_URL: http://127.0.0.1:${{ env.MCP_PORT }}
        run: uv run pytest tests/conformance/test_behaviour_v1.py -v
      - name: Logs on failure
        if: failure()
        run: make docker-logs || docker compose -f docker/docker-compose.yml logs
      - name: Teardown
        if: always()
        run: make docker-down || true
