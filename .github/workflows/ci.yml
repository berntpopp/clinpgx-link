name: CI

on:
  pull_request:
  push:
    branches: [main, feat/clinpgx-mcp]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint, typecheck and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON: '3.14'
      UV_FROZEN: 'true'
      GENEFOUNDRY_ROUTER_DIR: .fleet-contracts/router
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout pinned fleet contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: berntpopp/genefoundry-router
          ref: 6568a0ad7d68925440aba550a2a678282ea5bb6b
          path: .fleet-contracts/router
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14'
      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: '0.11.28'
          enable-cache: true
      - name: Verify lock and install
        run: |
          uv lock --check
          uv sync --frozen --group dev
      - name: Run local quality gate
        run: make ci-local
      - name: Check repository hooks
        run: uv run --frozen pre-commit run --all-files
