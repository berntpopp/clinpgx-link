# Dormant production-data template. Do not add to container-release.json or deploy
# until a rights-reviewed immutable bundle and its exact pins are approved.
# Layer after docker-compose.npm.yml. The external volume must already exist and
# its empty root must be owned by UID:GID 999:999 (mode 0700) before init runs.
services:
  clinpgx_link:
    environment:
      CLINPGX_DATA_ROOT: /data
      CLINPGX_SNAPSHOT_PATH: /data/current/clinpgx.sqlite
      CLINPGX_EXPECTED_SNAPSHOT: ${CLINPGX_EXPECTED_SNAPSHOT:?Pin the snapshot identity}
      CLINPGX_EXPECTED_RELEASE_TAG: ${CLINPGX_EXPECTED_RELEASE_TAG:?Pin the data release tag}
      CLINPGX_EXPECTED_RUNTIME_DIGEST: ${CLINPGX_EXPECTED_RUNTIME_DIGEST:?Pin the runtime identity}
    volumes:
      - type: volume
        source: clinpgx_data
        target: /data
        read_only: true
    depends_on:
      clinpgx_data_init:
        condition: service_completed_successfully

  clinpgx_data_init:
    image: ${CLINPGX_LINK_IMAGE:?Pin the same immutable application image}
    pull_policy: missing
    user: "999:999"
    entrypoint: ["clinpgx-link", "data", "install"]
    command:
      - --manifest
      - /release-input/manifest.json
      - --manifest-sha256
      - ${CLINPGX_RELEASE_MANIFEST_SHA256:?Pin the independently verified manifest}
      - --artifact
      - /release-input/release.tar.zst
      - --data-root
      - /data
    volumes:
      - type: volume
        source: clinpgx_data
        target: /data
      - type: bind
        source: ${CLINPGX_RELEASE_INPUT_DIR:?Mount independently verified local release files}
        target: /release-input
        read_only: true
        bind:
          create_host_path: false
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "1.0"
          pids: 256
    restart: "no"

volumes:
  clinpgx_data:
    external: true
    name: ${CLINPGX_DATA_VOLUME:?Provision a unique UID 999 data volume}
