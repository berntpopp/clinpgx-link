# Production NPM data binding for ClinPGx Link.
#
# Layer after docker/docker-compose.npm.yml. The release bundle is mounted from the
# controller-reviewed host seed directory and installed offline into a fresh external
# volume before the read-only application starts. The app and init use one exact image.
services:
  clinpgx_link:
    environment:
      CLINPGX_RUNTIME_MODE: production
      CLINPGX_DATA_ROOT: /data
      CLINPGX_SNAPSHOT_PATH: /data/current/clinpgx.sqlite
      CLINPGX_EXPECTED_SNAPSHOT: ${CLINPGX_EXPECTED_SNAPSHOT:?Pin the immutable SQLite snapshot identity}
      CLINPGX_EXPECTED_RELEASE_TAG: ${CLINPGX_EXPECTED_RELEASE_TAG:?Pin the immutable data release tag}
      CLINPGX_EXPECTED_RUNTIME_DIGEST: ${CLINPGX_EXPECTED_RUNTIME_DIGEST:?Pin the runtime-v1 identity digest}
    volumes:
      - type: volume
        source: clinpgx_data
        target: /data
        read_only: true
    depends_on:
      clinpgx_data_init:
        condition: service_completed_successfully

  clinpgx_data_init:
    image: ${CLINPGX_LINK_IMAGE:?Set CLINPGX_LINK_IMAGE to ghcr.io/berntpopp/clinpgx-link@sha256:<digest>}
    pull_policy: missing
    user: "999:999"
    entrypoint: ["clinpgx-link", "data", "install"]
    command:
      - --manifest
      - /release-input/data-release-manifest.json
      - --manifest-sha256
      - ${CLINPGX_RELEASE_MANIFEST_SHA256:?Pin the immutable data manifest bytes}
      - --artifact
      - /release-input/clinpgx-core.tar.zst
      - --data-root
      - /data
    environment:
      CLINPGX_EXPECTED_SNAPSHOT: ${CLINPGX_EXPECTED_SNAPSHOT:?Pin the immutable SQLite snapshot identity}
      CLINPGX_EXPECTED_RELEASE_TAG: ${CLINPGX_EXPECTED_RELEASE_TAG:?Pin the immutable data release tag}
      CLINPGX_EXPECTED_RUNTIME_DIGEST: ${CLINPGX_EXPECTED_RUNTIME_DIGEST:?Pin the runtime-v1 identity digest}
      CLINPGX_RELEASE_MANIFEST_SHA256: ${CLINPGX_RELEASE_MANIFEST_SHA256:?Pin the immutable data manifest bytes}
      CLINPGX_RELEASE_ARTIFACT_SHA256: ${CLINPGX_RELEASE_ARTIFACT_SHA256:?Pin the compressed artifact bytes}
    volumes:
      - type: volume
        source: clinpgx_data
        target: /data
      - type: bind
        source: /srv/genefoundry/clinpgx-seed
        target: /release-input
        read_only: true
        bind:
          create_host_path: false
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "1.0"
          pids: 256
    restart: "no"

volumes:
  clinpgx_data:
    external: true
    name: ${CLINPGX_DATA_VOLUME:?Provision a unique UID 999 data volume}
