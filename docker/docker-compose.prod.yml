# Production docker-compose override (Container & Deployment Hardening Standard v1).
# Layered on the base file:
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.prod.yml up -d

services:
  clinpgx-link:
    build: !reset null
    image: "${CLINPGX_LINK_IMAGE:?Set CLINPGX_LINK_IMAGE to ghcr.io/berntpopp/clinpgx-link@sha256:<digest>}"
    pull_policy: missing

    environment:
      GF_HEALTHCHECK_HOST: localhost
      CLINPGX_LOG_LEVEL: INFO
      CLINPGX_LOG_FORMAT: json
      CLINPGX_ALLOWED_HOSTS: '["localhost","127.0.0.1","::1","clinpgx-link.genefoundry.org"]'
      CLINPGX_ALLOWED_ORIGINS: '["https://clinpgx-link.genefoundry.org"]'

    ports: !reset []
    expose:
      - "8000"

    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    init: true
    restart: unless-stopped

    deploy: !override
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
          pids: 256

    healthcheck:
      test:
        ["CMD", "sh", "-c", "curl -f -H \"Host: $${GF_HEALTHCHECK_HOST}\" http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        labels: "service=clinpgx-link,environment=production"
